# This workflow is responsible for:
# - publishing artifacts to Maven Central
# - building and publishing javadocs to the git repository.
# It is triggered when a new release is created.

name: publish

on:
  release:
    types: [created]
  workflow_dispatch:
    # Allow this workflow to be triggered manually

permissions:
  contents: read

jobs:
  publish-release:
    name: publish-release
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 11
          distribution: 'temurin'
          cache: 'maven'
          # Configure ~/.m2/settings.xml
          server-id: central
          server-username-env-var: CP_USERNAME
          server-password-env-var: CP_PASSWORD
          # Import GPG key into build agent's local keystore
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          # Name of the env var holding the passphrase (set in the publish step below)
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Set artifact version to ${{ github.ref_name }}
        run: mvn -B versions:set -DnewVersion=${{ github.ref_name}} -DgenerateBackupPoms=false

      - name: Publish Javadocs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO_SLUG: ${{ github.repository }}
          GH_TAG: ${{ github.ref_name}}
        run: |
          mvn -B clean javadoc:aggregate
          build/publishJavadoc-gha.sh

      - name: Publish to Maven Central
        env:
          CP_USERNAME: ${{ secrets.CP_USERNAME }}
          CP_PASSWORD: ${{ secrets.CP_PASSWORD }}
          GPG_KEYNAME: ${{ secrets.GPG_KEYNAME }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn -B deploy -DskipTests -P central

      # Diagnostic: show exactly what was bundled and uploaded to Central.
      # Runs even if the deploy step fails, since validation happens inside it.
      # TODO: remove once debugging is done.
      - name: Inspect Central bundle
        if: always()
        run: |
          echo "--- central-staging tree"
          find target/central-staging -print | sort
          echo "--- central-bundle.zip contents"
          unzip -l target/central-publishing/central-bundle.zip